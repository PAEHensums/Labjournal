name: "Paula Lab Journal"
author: 
  - 'Paula Hensums'
output_dir: "docs"
exclude: 
  - "data"
  - "_test"
bibliography: references.bib
navbar:
  left:
    - icon: fa-home
      href: index.html
    - text: "My journal"
      menu:
      - text: "Week 1"
        href: 10_lab1.html
      - text: "Week 2"
        href: 20_lab2.html
      - text: "Week 3"
        href: 30_lab3.html
    - text: "Final project"
      menu:
      - text: "Introduction"
        href: A_introduction.html
      - text: "Theory"
        href: B_theory.html
      - text: "Data"
        href: C_data.html

  right:
  - icon: fab fa-github
    href: https://github.com/JochemTolsma/labjournal
output:
  html_document:
    theme: flatly
    highlight: default
    toc:  true
    toc_float: true
    number_sections: true
    code_folding: show
    code_download: yes
    css: tweaks.css
